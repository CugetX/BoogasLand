<!doctype html>
<html><body style="margin:0;background:#88b">
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
const p = new URLSearchParams(location.search);
const url = p.get('m');
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(900, 600); r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#9ab');
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2));
const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(2, 4, 3); scene.add(d);
new GLTFLoader().load(url, (g) => {
  const root = g.scene;
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  console.log('BOX', JSON.stringify({ min: box.min, max: box.max }));
  scene.add(root);
  root.traverse(o => { if (o.isMesh) { o.frustumCulled = false; console.log('MESH', o.name, o.material.name, o.material.transparent, o.material.opacity, o.visible); } });
  const views = [0, Math.PI / 2, Math.PI];
  const W = 300;
  r.setScissorTest(true);
  views.forEach((a, i) => {
    const cam = new THREE.PerspectiveCamera(35, W / 600, 0.01, 100);
    const dist = size.y * 1.7;
    cam.position.set(c.x + Math.sin(a) * dist, c.y, c.z + Math.cos(a) * dist);
    cam.lookAt(c);
    r.setViewport(i * W, 0, W, 600); r.setScissor(i * W, 0, W, 600);
    r.render(scene, cam);
  });
  window.__ready = true;
}, undefined, (e) => { console.log('ERR', e.message); window.__ready = true; });
</script>
</body></html>
